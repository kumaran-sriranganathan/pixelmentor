name: Deploy to Prod

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 1. Backend Tests
  # Must pass before release builds proceed.
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_ANON_KEY: "mock-anon-key"
          SUPABASE_SERVICE_KEY: "mock-service-key"
          SUPABASE_JWT_SECRET: "mock-jwt-secret"
          OPENAI_API_KEY: "mock-openai-key"
          CLOUDFLARE_ACCOUNT_ID: "mock-account-id"
          R2_ACCESS_KEY_ID: "mock-r2-key"
          R2_SECRET_ACCESS_KEY: "mock-r2-secret"
        run: |
          pytest tests/ \
            --tb=short \
            --junitxml=test-results.xml \
            -v

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-prod
          path: backend/test-results.xml

  # ─────────────────────────────────────────────
  # 2. Verify Production Railway Deployment
  # Railway auto-deploys on push to main branch.
  # This step verifies the deployment is healthy.
  # ─────────────────────────────────────────────
  verify-deployment:
    name: Verify Prod Deployment
    runs-on: ubuntu-latest
    needs: backend-tests
    continue-on-error: true

    steps:
      - name: Wait for Railway deployment
        run: sleep 60

      - name: Health check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.RAILWAY_PROD_URL }}/health")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed with status: ${HTTP_STATUS}"
            exit 1
          fi
          echo "✅ Prod deployment healthy"

  # ─────────────────────────────────────────────
  # 3. Build Signed Release AAB
  # Builds the signed Android App Bundle for
  # upload to Google Play Production track.
  # ─────────────────────────────────────────────
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Write local.properties
        working-directory: android
        run: |
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build Release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
